<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist Pulizie</title>
<link rel="stylesheet" href="style.css">
<style>
  .pulizie-header{text-align:center;padding:24px 20px 12px;background:#fff;border-bottom:1px solid #e8e8e4}
  .pulizie-logo{font-size:36px;margin-bottom:6px}
  .pulizie-title{font-size:18px;font-weight:700}
  .pulizie-sub{font-size:13px;color:#888;margin-top:4px}
  .zone-section{margin-bottom:20px}
  .zone-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#888;margin-bottom:8px;padding:0 2px}
  .btn-reset{width:100%;padding:12px;border-radius:10px;border:1px solid #e0e0da;background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#666;margin-top:8px}
  .btn-reset:hover{background:#f5f5f3}
  .all-done-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:20px;text-align:center;margin-top:16px;display:none}
  .all-done-banner.show{display:block}
  .all-done-emoji{font-size:36px;margin-bottom:8px}
  .all-done-text{font-size:15px;font-weight:600;color:#166534}
  .all-done-sub{font-size:12px;color:#166534;margin-top:4px}
</style>
</head>
<body>

<div class="pulizie-header">
  <div class="pulizie-logo">🧹</div>
  <div class="pulizie-title">Checklist Pulizie</div>
  <div class="pulizie-sub" id="header-sub">Appartamento Via Gioberti · Firenze</div>
</div>

<div class="content" style="max-width:600px">

  <div class="progress-wrap" style="margin-bottom:20px">
    <div class="progress-label"><span>Completamento</span><span id="prog-text">—</span></div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-bar" style="width:0%"></div></div>
  </div>

  <div id="tasks-by-zone"></div>

  <div class="all-done-banner" id="all-done">
    <div class="all-done-emoji">🎉</div>
    <div class="all-done-text">Tutte le attività completate!</div>
    <div class="all-done-sub">L'appartamento è pronto per il prossimo ospite.</div>
  </div>

  <button class="btn-reset" onclick="resetTasks()">🔄 Azzera tutte le attività</button>

  <div style="text-align:center;margin-top:20px;font-size:12px;color:#ccc">
    <a href="dashboard.html" style="color:#1a6b4a">← Torna alla dashboard admin</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let tasks=[];

onAuthStateChanged(auth, user=>{
  if(!user){ window.location.href='index.html'; return; }
  listenTasks();
});

function listenTasks(){
  onSnapshot(collection(db,'tasks'), snap=>{
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTasks();
  });
}

function renderTasks(){
  const zones=['Camera','Bagno','Cucina','Soggiorno','Generale'];
  const container=document.getElementById('tasks-by-zone');
  const all=tasks.length, done=tasks.filter(t=>t.done).length;

  document.getElementById('prog-text').textContent=done+'/'+all+' completate';
  document.getElementById('prog-bar').style.width=all?Math.round(done/all*100)+'%':'0%';
  document.getElementById('all-done').classList.toggle('show', all>0 && done===all);

  let html='';
  zones.forEach(zone=>{
    const zoneTasks=tasks.filter(t=>t.zona===zone);
    if(!zoneTasks.length) return;
    html+=`<div class="zone-section">
      <div class="zone-title">${zone}</div>`;
    zoneTasks.forEach(t=>{
      html+=`<div class="task-item ${t.done?'done-item':''}" id="task-${t.id}">
        <div class="task-check ${t.done?'done':''}" onclick="window.toggleTask('${t.id}',${!t.done})" style="font-size:14px">
          ${t.done?'✓':''}
        </div>
        <span class="task-label ${t.done?'done':''}">${t.descrizione||'—'}</span>
      </div>`;
    });
    html+='</div>';
  });

  // tasks without zone
  const other=tasks.filter(t=>!zones.includes(t.zona));
  if(other.length){
    html+=`<div class="zone-section"><div class="zone-title">Altro</div>`;
    other.forEach(t=>{
      html+=`<div class="task-item ${t.done?'done-item':''}" id="task-${t.id}">
        <div class="task-check ${t.done?'done':''}" onclick="window.toggleTask('${t.id}',${!t.done})" style="font-size:14px">
          ${t.done?'✓':''}
        </div>
        <span class="task-label ${t.done?'done':''}">${t.descrizione||'—'}</span>
      </div>`;
    });
    html+='</div>';
  }

  container.innerHTML=html||'<div class="empty"><div class="empty-icon">🧹</div><div class="empty-text">Nessuna attività trovata</div></div>';
}

window.toggleTask=async function(id,done){
  await updateDoc(doc(db,'tasks',id),{done});
  toast(done?'✓ Completata':'Riaperta');
};

window.resetTasks=async function(){
  if(!confirm('Azzerare tutte le attività?')) return;
  for(const t of tasks){ await updateDoc(doc(db,'tasks',t.id),{done:false}); }
  toast('Attività azzerate ✓');
};

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
